<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Puzzle Games</title>
    <meta
      name="description"
      content="Classic puzzle games in your browser: Tower of Hanoi and Lights Out. Hints, undo, auto-solvers and best scores, on desktop and mobile."
    />
    <meta name="theme-color" content="#eef0f8" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Puzzle Games" />
    <meta
      property="og:description"
      content="Tower of Hanoi and Lights Out: classic puzzles with hints, undo and auto-solvers."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the theme before the first paint so the page never flashes the wrong colours.
      // Keep the storage key in sync with src/lib/storage.ts and the colours with src/hooks/useTheme.ts.
      ;(function () {
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('puzzles:theme'))
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0c0f1d' : '#eef0f8')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tower of Hanoi needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
