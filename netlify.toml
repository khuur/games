# Netlify picks this file up automatically when the repository is linked to a site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# A missing build file should fail as a 404, not quietly come back as the app's HTML (which is what
# the catch-all below would do). Files that do exist are always served first.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Each game has its own address (/hanoi, /sudoku…) that the app itself handles, so any other path
# without a matching file serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite puts content hashes in every file name under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
