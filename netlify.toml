# Netlify picks this file up automatically when the repository is linked to a site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Each game has its own address (/hanoi, /lights-out) that the app itself handles, so any path
# without a matching file serves index.html. Real files such as /assets/* still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite puts content hashes in every file name under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
